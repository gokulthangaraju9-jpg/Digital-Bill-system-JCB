    <title>JCB Platform</title>
    <style>
      /* Loading fallback styles */
      #root:empty::before {
        content: "Loading...";
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: black;
        color: #FFCC00;
        font-size: 24px;
        font-weight: bold;
        font-family: Arial, sans-serif;
      }
      noscript {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div>
        <h1 style="color: #FFCC00;">JavaScript Required</h1>
        <p>This application requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
